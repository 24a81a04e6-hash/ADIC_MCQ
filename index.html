<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADIC MCQ Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Analog & Digital IC Applications</h1>

        <p class="sub">
            Interactive MCQ Quiz
        </p>

        <hr>

        <h2>Select a Topic</h2>

        <div class="topics">

            <button id="icBtn">Integrated Circuits</button>

            <button id="classBtn">Classification of ICs</button>

            <button id="opampBtn">Operational Amplifier</button>

            <button id="blockBtn">Block Diagram of Op-Amp</button>

            <button id="idealBtn">Ideal vs Practical Op-Amp</button>

            <button id="invBtn">Inverting Amplifier</button>

            <button id="nonInvBtn">Non-Inverting Amplifier</button>

            <button id="schmittBtn">Schmitt Trigger</button>

            <button id="instBtn">Instrumentation Amplifier</button>

        </div>

        <div id="quiz-box">

            <h2 id="topic-title"></h2>

            <div id="circuit-image"></div>

            <h3 id="question"></h3>

            <div id="options"></div>

            <br>

            <button id="nextBtn">Next Question</button>

        </div>

    </div>

    <script src="script.js"></script>

</footer>

</html>
